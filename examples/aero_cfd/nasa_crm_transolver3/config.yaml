dataset:
  processed_name: null
  chunk_count: 20
  validation_fraction: 0.2
  split_seed: 42
  resume: false
pipeline:
  stages:
  - trainprep
  - train
  - infer
  - post
data_root: ./data/nasa_physical
run_root: ./runs/nasa_crm_transolver3
train:
  max_epochs: 1
  batch_size: 1
  num_workers: 0
  device: auto
  precision: fp32
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.999
  scheduler_unit: epoch
  min_lr_ratio: 0.01
  gradient_clip: 1.0
  evaluation_split: validation
  validation_interval: 1
  evaluation_enabled: false
  parameter_group_policy: all
  ema_decay: null
model:
  parameters:
    n_hidden: 256
    n_layers: 24
    n_head: 8
    mlp_ratio: 2
    slice_num: 64
    space_dim: 12
    fun_dim: 0
    out_dim: 4
    unified_pos: false
    gradient_checkpointing: true
  sampling:
    seed: 2
    stride: 4
    chunk_count: 20
    random_stream: independent
trainprep:
  domains:
    surface:
      position: surface_position
      features:
        normals: surface_normals
      targets:
        cp: surface_cp
        cf: surface_cf
      query_targets: false
  conditioning:
    conditions:
      field: conditions
  normalization:
    execute: true
    fields:
      surface_position:
        method: identity
        scale: 1
      surface_cp:
        method: zscore
        scale: 1
      surface_cf:
        method: zscore
        scale: 1
      surface_normals:
        method: identity
        scale: 1
      conditions:
        method: zscore
        scope: condition
        scale: 1
post:
  random_stream: global
  split: test
  evaluate: true
  save_predictions: true
  export_vtk: true
  query: true
  sample_indices:
  - 0
  query_chunk_size: 16384
  overwrite: false
  samples:
  - Sample032
  - Sample019
  - Sample028
  - Sample004
  - Sample020
snapshot_modules:
- ai4e_spec
- ai4e_contrib
rawprep:
  vtkhdf: true
components:
  dataset: ai4e_contrib.application.datasets.nasa_crm
  model: ai4e_contrib.ability.model.transolver3.component
  application: ai4e_contrib.application.aero_cfd.operations
infer:
  fields: null
  metrics:
  - relative_l2
  - mae
  - rmse
  - max_abs_error
  - r2
  random_stream: global
  split: test
  evaluate: true
  save_predictions: true
  export_vtk: true
  query: true
  sample_indices:
  - 0
  query_chunk_size: 16384
  overwrite: false
  samples:
  - Sample032
  - Sample019
  - Sample028
  - Sample004
  - Sample020
  device: cpu
inputs:
  rawprep:
    source: ./inputs/nasa_crm
    manifest: null
    train_h5: ./inputs/nasa_crm/trainingData_NASA-CRM.h5
    test_h5: ./inputs/nasa_crm/testData_NASA-CRM.h5
    connectivity_h5: ./inputs/nasa_crm/connectivity_NASA-CRM.h5
  trainprep:
    partition: null
    dataset: ./data/nasa_physical/manifest.json
    statistics: null
  train:
    preparation: null
    resume: null
    initial_weights: null
  infer:
    preparation: null
    checkpoint: null
  post:
    results: null
