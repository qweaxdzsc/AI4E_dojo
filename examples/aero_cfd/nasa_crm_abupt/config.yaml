dataset:
  processed_name: null
  chunk_count: 20
  validation_fraction: 0.2
  split_seed: 42
  resume: false
pipeline:
  stages:
  - trainprep
  - train
  - infer
  - post
data_root: ../data/nasa_crm_abupt
run_root: ../runs/nasa_crm_abupt
train:
  mode: fit
  max_epochs: 1
  batch_size: 1
  device: auto
  precision: fp32
  num_workers: 0
  optimizer: lion
  learning_rate: 5.0e-05
  weight_decay: 0.05
  betas:
  - 0.9
  - 0.99
  scheduler: warmup_cosine
  warmup_ratio: 0.05
  min_lr: 1.0e-06
  accumulate: 1
  gradient_clip: 1.0
  ema_decay: null
  ema_save_every: 10
  test_repeat: 10
  evaluate_repeat: false
  snapshot: true
  save_on_interrupt: true
  evaluation_split: test
  log_every: 1
  log_every_updates: null
  evaluation_enabled: false
model:
  parameters:
    dim: 192
    geometry_depth: 6
    num_heads: 3
    blocks: pssssssssss
    radius: 9.0
    require_features: true
    num_domain_decoder_blocks:
      surface: 12
  freeze: []
  data_specs:
    position_dim: 3
    domains:
      surface:
        output_dims:
          cp: 1
          cf: 3
        feature_dim:
          normals: 3
    conditioning_dims:
      conditions: 6
  supervision:
  - name: surface_cp
    prediction: surface_cp
    target: surface_cp_target
    normalization: surface_cp
    weight: 1.0
    loss: mse
  - name: surface_cf
    prediction: surface_cf
    target: surface_cf_target
    normalization: surface_cf
    weight: 1.0
    loss: mse
  sampling:
    random_stream: global
    pipeline_seed: null
    seed: 42
    train_randomness: per_epoch
    evaluation_randomness: fixed
    geometry:
      method: uniform
      max_points: 3586
      replacement: false
      keep_order_when_all: true
    supernodes:
      method: uniform
      num_points: 512
      insufficient: error
    domains:
      surface:
        anchor:
          method: uniform
          num_points: 256
          insufficient: error
        query:
          method: uniform
          num_points: 0
          insufficient: error
trainprep:
  use_physics_features: true
  physical_rules: {}
  geometry_field: surface_position
  domains:
    surface:
      position: surface_position
      features:
        normals: surface_normals
      targets:
        cp: surface_cp
        cf: surface_cf
      query_targets: false
  conditioning:
    conditions:
      field: conditions
  geometry_conditioning: {}
  normalization:
    execute: true
    materialize: false
    fields:
      surface_position:
        method: coordinate
        scale: 1000
      surface_normals:
        method: identity
        scale: 1
      surface_cp:
        method: zscore
        scale: 1
      surface_cf:
        method: zscore
        scale: 1
      conditions:
        method: zscore
        scope: condition
        scale: 1
post:
  random_stream: global
  split: test
  evaluate: true
  save_predictions: true
  export_vtk: true
  query: true
  sample_indices:
  - 0
  query_chunk_size: 16384
  overwrite: false
  samples:
  - Sample032
  - Sample019
  - Sample028
  - Sample004
  - Sample020
snapshot_modules:
- ai4e_spec
- ai4e_contrib
rawprep:
  vtkhdf: true
components:
  dataset: ai4e_contrib.application.datasets.nasa_crm
  model: ai4e_contrib.ability.model.abupt.component
  application: ai4e_contrib.application.aero_cfd.operations
infer:
  fields: null
  metrics:
  - relative_l2
  - mae
  - rmse
  - max_abs_error
  - r2
  random_stream: global
  split: test
  evaluate: true
  save_predictions: true
  export_vtk: true
  query: true
  sample_indices:
  - 0
  query_chunk_size: 16384
  overwrite: false
  samples:
  - Sample032
  - Sample019
  - Sample028
  - Sample004
  - Sample020
  device: cpu
inputs:
  rawprep:
    source: ../inputs/nasa_crm
    manifest: null
    train_h5: ./inputs/nasa_crm/trainingData_NASA-CRM.h5
    test_h5: ./inputs/nasa_crm/testData_NASA-CRM.h5
    connectivity_h5: ./inputs/nasa_crm/connectivity_NASA-CRM.h5
  trainprep:
    partition: null
    dataset: ../datasets/nasa_crm/manifest.json
    statistics: null
  train:
    preparation: null
    resume: null
    initial_weights: null
  infer:
    preparation: null
    checkpoint: null
  post:
    results: null
