[project]
name = "ai4e-dojo"
version = "0.0.0"
description = "AI4E_Dojo workspace"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/ai4e-spec",
    "packages/ai4e-core",
    "packages/ai4e-contrib",
    "packages/ai4e-task",
    "packages/ai4e-server",
    "packages/ai4e-viz",
]

[tool.uv.sources]
ai4e-spec = { workspace = true }
ai4e-core = { workspace = true }
ai4e-contrib = { workspace = true }
ai4e-task = { workspace = true }
ai4e-server = { workspace = true }
ai4e-viz = { workspace = true }

[dependency-groups]
visualization = ["ai4e-viz[workbench]"]
verification = ["pyvista>=0.48"]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "ai4e-spec",
    "ai4e-core[post]",
    "ai4e-contrib[abupt,transolver3,pibsnet,gencp,pcno]",
    "ai4e-task",
    "ai4e-server",
    "ai4e-viz[workbench]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: 需要出站网络",
    "local_data: 需要本地 ShapeNet-Car 原始文件",
]

[tool.ruff]
# 此目录是固定外部用户源码，不随内部重构或格式化改写。
extend-exclude = [
    # WDNO 数值定义按抽取记录保留原文和 AST。
    "packages/ai4e-contrib/ability/model/wdno/unet.py",
    "packages/ai4e-contrib/ability/model/wdno/schedules.py",
    "packages/ai4e-contrib/ability/transform/wdno/layout.py",
    "packages/ai4e-contrib/ability/transform/wdno/multiscale.py",
    "packages/ai4e-contrib/ability/transform/wdno/preparation.py",
    "packages/ai4e-contrib/ability/constraint/wdno/objective.py",
    "packages/ai4e-contrib/ability/inference/wdno/diffusion.py",
    "packages/ai4e-contrib/ability/eval/wdno/metrics.py",
    "packages/ai4e-contrib/ability/model/safediffcon/*unet.py",
    "packages/ai4e-contrib/ability/model/safediffcon/*model_utils.py",
    "packages/ai4e-contrib/ability/inference/safediffcon/burgers.py",
    "packages/ai4e-contrib/ability/inference/safediffcon/tokamak.py",
    "packages/ai4e-contrib/ability/constraint/safediffcon/pinn_loss.py",
    "packages/ai4e-contrib/ability/postproc/safediffcon/kstar.py",
    "packages/ai4e-contrib/ability/postproc/safediffcon/kstar_common",
    "tests/fixtures/public_api_baseline",
    # 上游网络和辅助算子保留原算术/版权，不用自动修复改变参考实现。
    "packages/ai4e-contrib/ability/model/gencp/cno.py",
    "packages/ai4e-contrib/ability/model/gencp/sit_fno.py",
    "packages/ai4e-contrib/ability/model/gencp/modules",
]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"packages/ai4e-*/**" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["ai4e_core", "ai4e_spec", "ai4e_contrib"]

[tool.uv]
default-groups = ["dev", "visualization"]
# 仅图扩展复用已安装的 Torch；workspace 包继续隔离构建。
no-build-isolation-package = ["torch-cluster", "torch-scatter"]

# 与本机已验证的 pip 下载源一致，避免官方文件域名的 DNS 故障。
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
