<main id="app" class="shell"></main><div id="toast" class="toast hidden" role="status"></div><dialog id="modal"><button class="close" onclick="document.getElementById('modal').close()">关闭</button><div id="modalbody"></div></dialog>
<script>
/* 单文件原型仅在内存中模拟操作，不连接后端；刷新恢复样例。 */
const tabs=['任务管理','版本树','版本比较','项目报告','文件管理','批量运行'];
const steps=['数据采样','原数据处理','数据准备','模型设置','训练设置','后处理','报告'];
const versions=[{id:'A1',task:'基线模型',parent:null,delta:'初始基线',value:.043,anchors:2048},{id:'A2',task:'基线模型',parent:'A1',delta:'epoch: 100 → 200',value:.039,anchors:2048},{id:'B1',task:'增加锚点数',parent:'A1',delta:'anchors: 2048 → 4096',value:.035,anchors:4096},{id:'B2',task:'增加锚点数',parent:'B1',delta:'学习率: 0.001 → 0.0005',value:.032,anchors:4096},{id:'C1',task:'局部特征试验',parent:'B1',delta:'新增曲率特征',value:null,anchors:4096}];
let tasks=[{name:'基线模型',version:'A2',status:'已完成'},{name:'增加锚点数',version:'B2',status:'已完成'},{name:'局部特征试验',version:'C1',status:'运行中'}];
let projects=['汽车外流场代理模型'];
const state={page:'projects',tab:0,step:0,project:projects[0],task:0,selected:'B1',compare:['A1','A2','B1','B2','C1'],mode:'表格',quantity:'压力相对 L2',evidence:[],batch:[],stageDone:{},draft:{},fileFilter:''};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(text,action,primary=false)=>`<button class="${primary?'primary':''}" onclick="${esc(action)}">${text}</button>`;
const version=id=>versions.find(v=>v.id===id)||versions[0];
let toastTimer;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3200)}
function selectTab(i){state.tab=i;go('project',i)}
function openTask(i){state.task=i;state.step=0;go('workbench')}
function crumb(){return `<div class="breadcrumb"><button class="link" onclick="go('projects')">项目导航</button>${state.page!=='projects'?`　/　<button class="link" onclick="selectTab(0)">${esc(state.project)}</button>`:''}${state.page==='workbench'?`　/　${esc(tasks[state.task]?.name||'新任务')}　/　任务工作台`:''}</div>`}
function newProject(){const p=prompt('项目名称','新研究项目');if(p?.trim()){projects.push(p.trim());render();toast('项目已加入示意列表；各项目共用样例内容')}}
function renameProject(i){const p=prompt('修改项目名称',projects[i]);if(p?.trim()){projects[i]=p.trim();render()}}
function deleteProject(i){if(confirm('从原型列表移除此项目？不涉及真实文件。')){projects.splice(i,1);render()}}
function editTask(i){const n=prompt('修改任务名称',tasks[i].name);if(n?.trim()){tasks[i].name=n.trim();render()}}
function deleteTask(i){if(confirm('从原型列表移除任务？示意版本仍保留。')){tasks.splice(i,1);state.task=0;render()}}
function chart(){const available=state.compare.map(version).filter(v=>v.value!=null);return `<svg class="chart" viewBox="0 0 620 260" role="img" aria-label="各版本压力相对L2示意散点"><path d="M55 20 V215 H600" fill="none" stroke="#888"/><text x="10" y="17" fill="#777" font-size="12">相对 L2</text>${[.02,.03,.04,.05].map(v=>`<text x="15" y="${220-(v-.02)*5000}" font-size="11">${v}</text><path d="M55 ${215-(v-.02)*5000} H600" stroke="#eee"/>`).join('')}${available.map((v,i)=>`<circle cx="${110+i*110}" cy="${215-(v.value-.02)*5000}" r="6" fill="#5e7065"/><text x="${100+i*110}" y="239" font-size="12">${v.id}</text><text x="${95+i*110}" y="${200-(v.value-.02)*5000}" font-size="11">${v.value}</text>`).join('')}</svg><p class="muted">全项目散点：不把不同血缘连成演化曲线。C1 暂无结果，不按零值绘制。</p>`}
function carSvg(){return `<svg viewBox="0 0 380 180" role="img" aria-label="三维结果线框占位"><g fill="none" stroke="#78837a" stroke-width="1.2"><path d="M45 116 L75 88 L133 79 L170 47 L235 48 L283 83 L327 99 L334 126 L300 144 L86 145 Z M45 116 L277 117 L327 99 M133 79 L250 80 L283 83 M170 47 L186 82 M235 48 L250 80 L277 117 L300 144 M86 145 L98 117 M75 88 L98 117 M170 47 L133 79 L150 117 M235 48 L200 80 L220 117"/><ellipse cx="117" cy="133" rx="20" ry="18"/><ellipse cx="281" cy="130" rx="20" ry="18"/></g><text x="115" y="172" fill="#999" font-size="11">线框占位 · 无真实物理场</text></svg>`}
function viewers(){return `<div class="toolbar"><span class="badge">相机联动（示意）</span><span class="badge">统一色标：压力 / Pa</span><span class="muted">sample_001</span></div><div class="viewergrid">${state.compare.slice(0,4).map(id=>`<div class="view"><div class="viewtitle">${id} · 压力场 · 运行 r-${id.toLowerCase()}</div>${carSvg()}<div class="caption">surface_pressure.vtkhdf · 预览区域</div></div>`).join('')}</div><div class="note">最多同时示意四窗口。不同网格先并排查看；只有身份对齐后才可做差值。</div>`}
function toggleVersion(id,checked){state.compare=checked?[...state.compare,id]:state.compare.filter(x=>x!==id);render()}
function compareTable(){return `<div class="tablewrap"><table><thead><tr><th>版本</th><th>父版本</th><th>${state.quantity==='锚点数量'?'锚点数量':'压力相对 L2'}</th><th>与 A1 差值</th></tr></thead><tbody>${state.compare.map(version).map(v=>`<tr><td>${v.id}</td><td>${v.parent||'—'}</td><td>${state.quantity==='锚点数量'?v.anchors:v.value??'缺失'}</td><td>${state.quantity==='锚点数量'?v.anchors-2048:v.value==null?'—':(v.value-.043).toFixed(3)}</td></tr>`).join('')}</tbody></table></div><div class="note">文件比较请切换“多窗口”。缺失与不可比版本保留在清单中。</div>`}
function reportContent(task=false){return `<div class="cols"><section class="panel"><div class="hint">${task?'TASK':'PROJECT'} REPORT / 草稿</div><h2 contenteditable="true">${task?'任务执行报告':'模型精度演进研究报告'}</h2><div class="reportblock"><h3>01 / 研究目标与结论</h3><textarea aria-label="报告说明" placeholder="写下研究目标、方案变化与结论…" oninput="state.draft.report=this.value">${esc(state.draft.report||'比较锚点数与训练参数对外流场预测精度的影响。')}</textarea></div><div class="reportblock"><h3>02 / 版本演进</h3><p>A1 → A2：训练轮次调整<br>A1 → B1 → B2：增加锚点与学习率试验</p></div>${state.evidence.map((e,i)=>`<div class="reportblock"><div class="row"><h3>0${i+3} / ${esc(e.q)} · ${e.mode}</h3><div class="spacer"></div>${btn('移除',`state.evidence.splice(${i},1);render()`)}</div><p class="muted">来源：${e.versions.join(' / ')} · 固定版本引用</p><div class="placeholder" style="min-height:100px">${e.mode==='三维可视化'?'多窗口三维视图快照':'比较图表快照'} · 示意</div>${btn('返回比较',`state.compare=${JSON.stringify(e.versions).replaceAll('"',"'")};state.compareMode='${e.mode}';selectTab(2)`)}</div>`).join('')}</section><aside class="panel"><h3>证据资产</h3><p>${state.evidence.length} 项比较已加入</p><div class="stack">${btn('从版本比较添加','selectTab(2)')}${btn('从文件管理添加','selectTab(4)')}${btn('发布报告（演示）','toast("已模拟发布：引用与视图将在正式版冻结")',true)}${btn('打印 / 另存 PDF','window.print()')}</div><div class="note">任务报告记录单任务过程；项目报告组织跨任务、跨版本结论。</div></aside></div>`}
function projectReport(){return reportContent()}
const fileRows=[['A1','原数据处理','surface.vtkhdf','网格与字段'],['A2','训练','checkpoint.pt','模型权重'],['B1','后处理','surface_pressure.vtkhdf','三维压力场'],['B2','后处理','metrics.json','评估指标'],['B2','训练','loss_curve.svg','训练曲线'],['C1','数据准备','normalization.yaml','冻结统计']];
function filterFiles(){document.getElementById('filerows').innerHTML=fileTable()}
function batches(){return `<div class="cols"><section class="panel"><h2>批量派生计划</h2><p class="muted">先选择 base 和改动，再检查每一行，最后批量创建任务。</p><div class="formgrid"><div><label>Base 版本（可多选）</label><div class="checks">${['A1','B1','B2'].map(id=>`<label><input class="basecheck" type="checkbox" value="${id}" ${id==='A1'?'checked':''}> ${id} · ${version(id).task}</label>`).join('')}</div></div><div><label>修改参数</label><select id="batchparam"><option value="anchors">模型 / anchors</option><option value="epoch">训练 / epoch</option></select><label>候选值（逗号分隔）</label><input id="batchvalues" value="2048, 4096, 8192"></div></div><div class="foot">${btn('生成计划表','generateBatch()',true)}<span class="muted">逐 base × 候选值展开</span></div><div class="tablewrap" style="margin-top:20px"><table><thead><tr><th>base</th><th>派生任务</th><th>本次修改</th><th>状态</th></tr></thead><tbody>${state.batch.map((r,i)=>`<tr><td>${r.base}</td><td>${r.taskIndex!=null?btn(r.name,`openTask(${r.taskIndex})`):esc(r.name)}</td><td>${r.param} → ${r.value}</td><td>${r.status}</td></tr>`).join('')||'<tr><td colspan="4">生成计划后，这里逐行列出继承关系和差异。</td></tr>'}</tbody></table></div></section><aside class="panel"><h3>运行策略</h3><label>执行资源</label><select><option>本地 GPU / 示例</option></select><label>执行范围</label><input value="完整流程（已有数据起步）" readonly><label>并发数</label><input type="number" value="1" min="1"><p class="muted" style="margin-top:15px">继承 base 全部设置，只覆盖计划中列出的参数。</p>${btn('运行计划（演示）','runBatch()',true)}<div class="note">仅模拟创建与排队，不占用真实计算资源。</div></aside></div>`}
function generateBatch(){const bases=[...document.querySelectorAll('.basecheck:checked')].map(x=>x.value),values=document.getElementById('batchvalues').value.split(/[,，]/).map(x=>Number(x.trim())),param=document.getElementById('batchparam').value;if(!bases.length||values.some(v=>!Number.isFinite(v)||v<=0)){toast('请选择 base 并填写正数候选值');return}state.batch=bases.flatMap(base=>values.map(value=>({base,value,param,name:`${base}-${param}-${value}`,status:'待运行'})));render()}
function runBatch(){if(!state.batch.length){toast('请先生成计划表');return}let n=0;state.batch.forEach(r=>{if(r.taskIndex!=null)return;const src=version(r.base),id='F'+(versions.length+1);versions.push({...src,id,parent:r.base,task:r.name,delta:`${r.param} → ${r.value}`,value:null,[r.param]:r.value});r.taskIndex=tasks.length;tasks.push({name:r.name,version:id,status:'排队中'});r.status='已创建 / 排队中';n++});render();toast(n?`已模拟创建 ${n} 个任务，点击任务名进入工作台`:'计划已提交，不重复创建任务')}
function stepGo(n){state.step=n;location.hash='workbench/'+n}
function simulateStage(){state.stageDone[state.task+'-'+state.step]=true;render();toast('已模拟阶段完成；未调用真实计算')}
function showLogs(){document.getElementById('modalbody').innerHTML='<h2>阶段日志 · 示例</h2><div class="log">[阶段 / 校验 / 通过] 输入声明完整<br>[阶段 / 执行 / 开始] 示例资源<br>[阶段 / 保存 / 完成] 示例产物已登记</div><p class="muted">真实日志、进度和资源信息将在服务接入后提供。</p>';document.getElementById('modal').showModal()}</script>
<script>
/* 第二版：任务与版本一一对应；侧栏承载页面导航，工作台步骤在顶部。 */
steps.splice(0,steps.length,'数据采样','原数据处理','数据准备','模型设置','训练设置','训练运行','后处理','报告');
Object.assign(state,{collapsed:false,projectQuery:'',projectStatus:'全部状态',projectSort:'更新时间 ↓',taskQuery:'',treeStep:2,treeGroup:'参数',compareParams:[],fileVersion:'全部版本',fileType:'全部类型',fileSort:'更新时间 ↓',previewMode:'表格',stageView:'配置',compareMode:'表格'});
const projectMeta={};
projects.push('机翼压力场预测','电池热管理研究');
projects.forEach((name,i)=>projectMeta[name]={status:i===2?'已归档':'进行中',owner:['研究员林','研究员周','研究员陈'][i],created:`2026-09-0${i+1}`,updated:`2026-09-0${9-i}`});
tasks=versions.map((v,i)=>({name:v.task+(v.id==='A2'?' · 延长训练':v.id==='B2'?' · 学习率调整':''),version:v.id,status:i===4?'运行中':'已完成',owner:['研究员林','研究员周','研究员陈'][i%3],created:`2026-09-0${i+1} 09:00`,updated:`2026-09-0${i+5} 14:30`,progress:i===4?5:8}));

function route(){const [page,n]=location.hash.slice(1).split('/');state.page=['project','workbench'].includes(page)?page:'projects';if(page==='project')state.tab=Math.max(0,Math.min(5,Number(n)||0));if(page==='workbench')state.step=Math.max(0,Math.min(7,Number(n)||0));render();window.scrollTo(0,0)}

function go(page,tab=state.tab){const hash=page==='project'?`project/${tab}`:page==='workbench'?`workbench/${state.step}`:page;state.page=page;state.tab=tab;if(location.hash.slice(1)===hash)render();else location.hash=hash}
function options(values,chosen){return values.map(v=>`<option ${v===chosen?'selected':''}>${esc(v)}</option>`).join('')}

function newTask(base){const name=prompt('任务名称',base?`从 ${base} 派生的新任务`:'新研究任务');if(!name?.trim())return;const src=base?version(base):versions[0],id='D'+(versions.length+1);versions.push({...src,id,parent:base||null,baseline:src.baseline||'A1',task:name.trim(),delta:'新任务配置',value:null});tasks.push({name:name.trim(),version:id,status:'草稿',owner:'当前用户',created:'2026-09-09 10:00',updated:'2026-09-09 10:00',progress:0});state.task=tasks.length-1;state.step=0;go('workbench')}
function openVersionTask(id){const i=tasks.findIndex(t=>t.version===id);if(i>=0){state.task=i;state.step=state.treeStep;go('workbench')}else toast('该任务已从列表移除')}
function stageRows(v,index,group){if(group==='输入')return [['输入数据集','dataset-v1'],['来源任务',v.parent||'原始数据'],['输入版本',v.baseline||'A1']];if(group==='输出')return [['阶段结果',index===5?'metrics.json':index===6?'surface_pressure.vtkhdf':'stage-record.json'],['压力相对 L2',v.value??'尚无结果'],['产物状态',v.value==null?'未完成':'已交付']];return stageDefinitions[index].groups.flatMap(g=>g[1]).map(([name,value])=>[name,name==='锚点数量'?v.anchors:Array.isArray(value)?value[0]:value]);}
function addPickedParams(){const rows=stageRows(version(state.selected),state.treeStep,state.treeGroup),picks=[...document.querySelectorAll('.parampick:checked')];if(!picks.length){toast('请先勾选输入、输出或参数');return}picks.forEach(p=>{const [name]=rows[Number(p.value)],key=state.treeStep+':'+state.treeGroup+':'+name;if(!state.compareParams.some(x=>x.key===key))state.compareParams.push({key,name,stage:state.treeStep,group:state.treeGroup})});render();toast(`已加入 ${picks.length} 项，可前往版本比较`)}
function compareControls(){return `<div class="comparetools"><div><h3>对比参数 <span class="badge">${state.compareParams.length}</span></h3><div class="parameterchips">${state.compareParams.map((p,i)=>`<span class="badge">${steps[p.stage]} / ${esc(p.name)} <button class="link" onclick="state.compareParams.splice(${i},1);render()">×</button></span>`).join('')||'<span class="muted">从版本树勾选参数加入；此处先显示压力指标示例。</span>'}</div></div><div class="toolbar"><label>版本范围 <select aria-label="比较版本范围" onchange="state.compare=this.value==='全部版本'?versions.map(v=>v.id):['A1','B1','B2'];render()"><option>全部版本</option><option ${state.compare.length===3?'selected':''}>A1 / B1 / B2</option></select></label><label>基线 <select><option>A1</option></select></label><label>分片 <select><option>validation</option><option>test</option></select></label><div class="spacer"></div>${btn('添加参数','selectTab(1)')}${btn('加入项目报告','addEvidence()',true)}</div></div>`}
function comparison(){return `<div class="workspacewithrail"><nav class="viewrail"><div class="hint">版本比较</div>${['表格','趋势','三维可视化'].map((m,i)=>`<button class="${state.compareMode===m?'active':''}" onclick="state.compareMode='${m}';render()"><strong>0${i+1}</strong><b>${m}</b><small>${['参数与结果逐列查看','观察参数随版本变化','管线、属性与多视图'][i]}</small></button>`).join('')}</nav><section class="panel comparemain"><h2>${state.compareMode}</h2>${compareControls()}${state.compareMode==='表格'?parameterTable():state.compareMode==='趋势'?parameterTrend():viewer('comparison')}</section></div>`}

function parameterTrend(){const p=state.compareParams[state.trendIndex||0];let values=state.compare.map(version).map(v=>({id:v.id,value:p?Number(comparisonValue(v,p)):v.value}));return `<label>趋势参数 <select aria-label="趋势参数" onchange="state.trendIndex=Number(this.value);render()">${state.compareParams.length?state.compareParams.map((x,i)=>`<option value="${i}" ${i===(state.trendIndex||0)?'selected':''}>${esc(x.name)}</option>`).join(''):'<option>压力相对 L2</option>'}</select></label>${values.some(x=>Number.isFinite(x.value)&&x.value!=null)?simplePlot(values,p?.name||'压力相对 L2'):'<div class="placeholder">该参数为文本或资产，请使用表格或三维可视化。</div>'}<div class="note">按版本绘制示意散点；不同分支不自动连线，缺失值不归零。</div>`}
function simplePlot(values,title){const nums=values.filter(v=>Number.isFinite(v.value)&&v.value!=null),max=Math.max(...nums.map(v=>v.value),1e-6);return `<svg viewBox="0 0 650 260" class="chart"><text x="20" y="20" fill="#777" font-size="13">${esc(title)}</text><path d="M55 40 V220 H630" stroke="#999" fill="none"/>${nums.map((v,i)=>`<circle cx="${90+i*480/Math.max(nums.length-1,1)}" cy="${215-v.value/max*155}" r="5" fill="#536b60"/><text x="${78+i*480/Math.max(nums.length-1,1)}" y="245" font-size="12">${v.id}</text><text x="${72+i*480/Math.max(nums.length-1,1)}" y="${200-v.value/max*155}" font-size="11">${v.value}</text>`).join('')}</svg>`}
function addEvidence(){state.evidence.push({q:state.compareParams.map(p=>p.name).join('、')||'压力场 / 指标',mode:state.compareMode,versions:[...state.compare]});selectTab(3);toast('当前比较已加入项目报告')}

function viewer(context){const v=viewerStates[context];return `<div class="pv"><div class="pvmenu"><b>可视化工作区</b><span>文件　视图　过滤器　工具</span><div class="spacer"></div><small>ParaView 布局示意 · 非真实渲染</small></div><div class="pvtoolbar">${btn('＋ 添加视图',`viewerStates.${context}.windows.push(viewerStates.${context}.next++);refreshViewer('${context}')`)}<select aria-label="相机视角" onchange="viewerStates.${context}.camera=this.value;refreshViewer('${context}')">${options(['等轴测','正视图','俯视图'],v.camera)}</select>${btn('重置相机',`viewerStates.${context}.camera='等轴测';refreshViewer('${context}')`)}<label><input type="checkbox" checked> 联动相机</label></div><div class="pvbody"><aside class="pvleft"><h3>Pipeline Browser</h3><label><input type="checkbox" checked onchange="viewerStates.${context}.hidden=!this.checked;refreshViewer('${context}')"> ◇ surface_pressure</label>${v.applied.map((f,i)=>`<p class="pipelinechild">└ ${esc(f)} ${i+1}</p>`).join('')}<hr><h3>Properties</h3><label>Filter <select aria-label="过滤器" onchange="viewerStates.${context}.filter=this.value">${options(['Clip','Slice','Contour','Threshold'],v.filter)}</select></label>${btn('Apply',`viewerStates.${context}.applied.push(viewerStates.${context}.filter);refreshViewer('${context}')`)}<label>Color by <select aria-label="显示字段" onchange="viewerStates.${context}.field=this.value;refreshViewer('${context}')">${options(['压力 / Pa','速度 / m/s','误差 / Pa'],v.field)}</select></label><label>Representation <select aria-label="显示方式" onchange="viewerStates.${context}.display=this.value;refreshViewer('${context}')">${options(['Surface','Wireframe','Points'],v.display)}</select></label><label>Opacity <input type="range" min="15" max="100" value="${v.opacity||100}" oninput="viewerStates.${context}.opacity=this.value;document.querySelectorAll('[data-viewcontext=${context}] .mesh').forEach(x=>x.style.opacity=this.value/100)"></label><label>范围 <input value="0 — 1000" aria-label="色标范围"></label><small>过滤器与显示选项演示交互，不执行网格运算。</small></aside><section class function postContent(){return `<div class="toolbar postmodes">${['三维可视化','指标','图表'].map(m=>btn(m,`viewerStates.post.tab='${m}';render()`,viewerStates.post.tab===m)).join('')}<div class="spacer"></div>${btn('弹出查看窗口',"popupVisual('三维可视化')")}</div>${viewerStates.post.tab==='三维可视化'?viewer('post'):viewerStates.post.tab==='指标'?`<div class="formgrid"><label>检查点 <select><option>best checkpoint</option></select></label><label>分片 <select><option>test</option><option>validation</option></select></label></div>${assetTable()}`:chart()}`}

function taskList(){return `<div class="toolbar tasktoolbar"><input aria-label="搜索任务" value="${esc(state.taskQuery)}" placeholder="⌕　搜索任务 / 版本 / 操作人" oninput="state.taskQuery=this.value;filterTaskRows()"><div class="spacer"></div><select aria-label="任务状态" onchange="state.taskStatus=this.value;filterTaskRows()">${options(['全部状态','已完成','运行中','草稿'],state.taskStatus)}</select><select aria-label="任务排序" onchange="state.taskSort=this.value;filterTaskRows()">${options(['更新时间 ↓','创建时间 ↑'],state.taskSort)}</select><span class="badge">基线版本 A1</span><details class="newtaskmenu"><summary>＋ 新建任务　⌄</summary><div>${btn('新建','newTask()')}${btn('Fork',`newTask('${state.selected}')`)}</div></details></div><div class="panel tablewrap taskpanel"><table class="tasktable"><thead><tr><th>任务名称</th><th>版本</th><th>来源</th><th>基线版本</th><th>操作人</th><th>创建时间 / 更新时间</th><th>操作</th></tr></thead><tbody id="taskrows">${taskRows()}</tbody></table><div class="note">ⓘ　来源 = 直接父版本；基线版本 = 本次研究的比较基准。任务不再细分子版本，改方案通过 fork 形成新任务。</div></div>`}
function taskRows(){let rows=tasks.map((t,i)=>({t,i})).filter(({t})=>(t.name+t.version+t.owner).includes(state.taskQuery)&&(state.taskStatus==='全部状态'||t.status===state.taskStatus));rows.sort((a,b)=>state.taskSort==='创建时间 ↑'?(a.t.created||'').localeCompare(b.t.created||''):(b.t.updated||'').localeCompare(a.t.updated||''));return rows.map(({t,i})=>`<tr data-task="${esc(t.name+t.version)}"><td><b>${esc(t.name)}</b> ${statusTag(t.status)}</td><td>${t.version}</td><td>${version(t.version).parent||'—'}</td><td>${version(t.version).baseline||'A1'}</td><td>${t.owner||'当前用户'}</td><td><small>${(t.created||'2026-09-09').slice(0,10)} / ${(t.updated||'2026-09-09').slice(0,10)}</small></td><td>${btn('进入工作台',`openTask(${i})`)} ${btn('血缘',`state.selected='${t.version}';selectTab(1)`)} ${btn('编辑',`editTask(${i})`)} <button class="danger" onclick="deleteTask(${i})">删除</button></td></tr><tr><td colspan="7" class="progresscell"><div class="ministeps">${steps.map((s,j)=>`<button class="${j<(t.progress??0)?'done':j===(t.progress??0)?'current':''}" onclick="state.task=${i};state.step=${j};go('workbench')"><span>${j<(t.progress??0)?'✓':j+1}</span>${s}</button>`).join('')}</div></td></tr>`).join('')||'<tr><td colspan="7">没有匹配任务</td></tr>'}

function lineage(){const xy=[[300,75],[120,245],[480,245],[370,415],[690,415]],v=version(state.selected);return `<div class="toolbar treeactions"><div class="spacer"></div>${btn('⑂　基于选中任务 Fork',`newTask('${v.id}')`,true)}</div><div class="cols treecols"><section class="panel tree"><div class="toolbar"><h2>版本血缘图</h2><div class="spacer"></div>${btn('＋ 放大','state.treeZoom=Math.min(1.5,state.treeZoom+.15);render()')}${btn('－ 缩小','state.treeZoom=Math.max(.6,state.treeZoom-.15);render()')}${btn('重置','state.treeZoom=1;render()')}</div><div class="treecanvas"><svg viewBox="0 0 920 535" style="transform:scale(${state.treeZoom});transform-origin:center" aria-label="任务版本血缘"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#829aca"/></marker></defs><g stroke="#829aca" fill="none" marker-end="url(#arrow)"><path d="M420 113 V160 Q420 180 400 180 H260 Q240 180 240 200 V205"/><path d="M420 113 V160 Q420 180 440 180 H580 Q600 180 600 200 V205"/><path d="M600 283 V330 Q600 350 580 350 H510 Q490 350 490 375"/><path d="M600 283 V330 Q600 350 620 350 H790 Q810 350 810 375"/></g>${versions.slice(0,5).map((x,i)=>`<g class="node ${x.id===v.id?'selected':''}" role="button" tabindex="0" aria-label="选择任务 ${x.id}" onclick="state.selected='${x.id}';render()" onkeydown="if(event.key==='Enter'){state.selected='${x.id}';render()}"><rect x="${xy[i][0]}" y="${xy[i][1]-40}" width="230" height="80" rx="8"/><circle cx="${xy[i][0]+24}" cy="${xy[i][1]-7}" r="8" fill="${x.id===v.id?'#0875ff':'#8aafea'}"/><text x="${xy[i][0]+43}" y="${xy[i][1]-10}">${x.id} · ${esc(x.task.slice(0,10))}</text><text class="sub" x="${xy[i][0]+43}" y="${xy[i][1]+16}">来源：${x.parent||'—'} / 基线 A1</text></g>`).join('')}</svg></div><div class="note">ⓘ　节点 = 一个任务的版本；线 = 来源关系。右侧只检查所选任务。</div></section><aside class="panel treeinspector">${treeInspector()}</aside></div>`}

function showRecipe(kind){let body=kind==='config'?`<p>当前仓库配置快照（只读示意），页面示例修改不回写仓库。</p><pre class="configcode">${esc(recipeYaml)}</pre>`:kind==='flow'?`<p>四阶段按顺序执行；八个工作台步骤是用户操作分组，不是八个独立脚本。</p><div class="flowcards">${recipeFlow.map((s,i)=>`<div><b>${i+1} / ${s}</b><small>${['原始数据处理','数据准备','模型与训练设置、训练运行','推理评估与网格结果'][i]}</small></div>`).join('')}</div><div class="note">已有处理数据：训练准备 → 训练 → 后处理。已有准备记录：训练 → 后处理。已有权重：单独后处理。</div><p>检查模式不会生成数据；前处理 dry-run 后，下游验证等待真实数据交付。数据采样和报告属于平台规划。</p>`:`<table><thead><tr><th>阶段</th><th>消费</th><th>交付</th></tr></thead><tbody><tr><td>原始处理</td><td>原始样本 / 官方分片</td><td>manifest.json / .pt / 统计；可选 VTKHDF</td></tr><tr><td>数据准备</td><td>数据 manifest</td><td>preparation.json / 冻结归一化 / 采样声明</td></tr><tr><td>训练</td><td>准备引用 / 模型与监督</td><td>training.json / best、latest、last 检查点</td></tr><tr><td>后处理</td><td>已有检查点 / 指定 test 样本</td><td>指标、预测、点云、完整网格、post-progress.json</td></tr></tbody></table><div class="note">完整流程自动交接产物，不要求预填将来的检查点或准备记录。独立运行时才选择已有引用。部分失败分别记录评估、预测和网格交付状态。</div>`;document.getElementById('modalbody').innerHTML=`<h2>${kind==='config'?'Recipe 配置快照':kind==='flow'?'顺序执行范围':'阶段产物交接'}</h2>${body}`;document.getElementById('modal').showModal()}

function rawProcessing(){const count=state.rawFiles.filter(Boolean).length;return `<div class="rawcolumns"><section class="panel rawfilepanel"><div class="toolbar"><h2>数据文件 <small>（已选文件：${count}）</small></h2><div class="spacer"></div>${btn('＋ 选择数据源','rawSourceDialog()')}</div><label>来源匹配模板 <small>ShapeNet-Car</small></label><div class="row"><input id="rawpattern" aria-label="匹配文件名" value="${esc(state.rawPattern)}" placeholder="*.vtk" oninput="state.rawPattern=this.value">${btn('扫描匹配','scanRaw()',true)}</div><div class="sourcebrief">样本：param*/*　分片：official<br><small>surface → quadpress_smpl.vtk<br>volume → hexvelo_smpl.vtk</small></div><div class="tablewrap"><table class="rawfiletable"><thead><tr><th>文件名</th><th>类型</th><th>大小</th><th>操作</th></tr></thead><tbody><tr><td colspan="4"><b>⌄　▰ shapenet_car /</b></td></tr>${['param0/1','param0/2'].map(sample=>`<tr><td colspan="4"><b style="padding-left:14px">⌄　▰ ${sample}/</b></td></tr>${rawEntries.map((f,i)=>({f,i})).filter(x=>x.f[0]===sample).map(({f,i})=>`<tr><td><label><input type="checkbox" ${state.rawFiles[i]?'checked':''} onchange="state.rawFiles[${i}]=this.checked;render()"><span>▤ ${f[2]}<small>${f[1]} / ${f[0]}</small></span></label></td><td>${f[3]}</td><td>${f[4]} MB</td><td>${btn('预览',`state.previewTitle='${f[0]} / ${f[2]}';state.previewMode='三维可视化';renderPreview();document.getElementById('modal').showModal()`)}</td></tr>`).join('')}`).join('')}<tr><td>　▤ partition.yaml</td><td>YAML</td><td>示例</td><td>${btn('预览',"state.previewTitle='官方分片名单';state.previewMode='文本';renderPreview();document.getElementById('modal').showModal()")}</td></tr></tbody></table></div><div class="note">样例文件仅演示来源、选择与跳转，不读取实际数据。</div></section><section class="panel rawsettings"><div class="toolbar"><h2>处理设置</h2><div class="spacer"></div>${btn('恢复默认配置','resetRaw()')}</div><p class="muted">按模板明确选择字段、筛选、几何与保存。</p>${rawSettings()}</section><section class="panel rawexecution"><h2>执行配置</h2><p class="muted">先预检，再按已选样本执行和提交。</p><details open><summary>执行设置</summary><label>样本执行 <select><option>顺序执行（当前能力）</option></select></label><label>错误策略 <select id="rawerror"><option>首错停止</option><option>继续剩余样本并报告失败</option></select></label><label>已有输出 <select><option>拒绝覆盖</option><option>显式覆盖并保留备份</option></select></label><label><input type="checkbox" checked disabled> 输出预检与正式提交使用同一套规则</label><div class="toolbar">${btn('预检（演示）','rawCheck()')}${btn('▶ 执行（演示）','rawExecute()',true)}</div><small>原子提交、失败保留已成功结果；部分失败不发布完整数据清单。</small></details><div class="resultheader"><h3>处理结果预览</h3>${btn('查看全部结果',"popupVisual('表格')")}</div><div class="resultcards">${[['已选数据',`${count} 个文件`,'表格'],['字段校验',state.rawChecked?'检查通过':'等待预检','表格'],['几何与筛选',state.rawOptions.geometry?'3 项派生':'未启用','三维可视化'],['保存结果',state.rawRun?'已模拟提交':'等待执行','文本']].map(([name,val,mode])=>`<button onclick="popupVisual('${mode}')"><b>${name}</b><span>▦</span><small>${val}</small></button>`).join('')}</div><div class="outputs"><b>输出清单</b><p>manifest.json<br>surface_pressure.pt / volume_velocity.pt<br>statistics.yaml${state.rawOptions.vtkhdf?'<br>surface.vtkhdf / volume.vtkhdf<br>entity_mapping.json':''}</p></div></section></div>${rawLogPanel()}`}
function rawSettings(){return `<details open><summary>字段提取与身份校验</summary><label><input type="checkbox" checked disabled> 表面压力 · point_scalars · 标量</label><label><input type="checkbox" checked disabled> 体积速度 · point_vectors · 3 分量</label><label><input type="checkbox" checked disabled> 坐标、归属、实体数量与原 ID 对齐</label><small>单位未在源 manifest 确认，先展示 unknown，不自动宣称 Pa / m/s。</small></details><details open><summary>几何派生与筛选</summary><label><input type="checkbox" ${state.rawOptions.geometry?'checked':''} onchange="state.rawOptions.geometry=this.checked;render()"> 最近顶点距离 / 法向 / 重合点标记</label><label><input type="checkbox" ${state.rawOptions.mask?'checked':''} onchange="state.rawOptions.mask=this.checked;render()"> surface.mask / volume.exterior_mask</label><label><input type="checkbox" checked disabled> 筛选后再次校验字段行身份</label><small>不将自动缺失值填充、异常值修复作为已有能力。</small></details><details open><summary>保存与统计</summary><label>输出数据根 <input value="/shared/datasets/car_experiment"></label><label>保存字段 <input value="surface_pressure / position / normals …"></label><label>输出格式 <select aria-label="原数据输出格式" onchange="state.rawOptions.vtkhdf=this.value==='PT + VTKHDF';render()">${options(['PT','PT + VTKHDF'],state.rawOptions.vtkhdf?'PT + VTKHDF':'PT')}</select></label><label>统计策略 <select aria-label="统计策略" onchange="state.rawOptions.stats=this.value"><option value="reference" ${state.rawOptions.stats==='reference'?'selected':''}>引用参考统计</option><option value="fit" ${state.rawOptions.stats==='fit'?'selected':''}>完整训练分片重算</option><option value="none" ${state.rawOptions.stats==='none'?'selected':''}>不生成统计</option></select></label><small>原始网格与 PT 按实体映射关联；不支持图中 Parquet 的占位承诺。</small></details><details><summary>用户组件</summary><p>选择已登记的用户组件，按全限定入口引用。</p>${btn('查看组件接入',"showComponent()")}</details>`}
function rawSourceDialog(){document.getElementById('modalbody').innerHTML='<h2>选择数据源</h2><label>数据集适配器 <select><option>ShapeNet-Car</option></select></label><label>原始数据根 <input style="width:100%" value="/shared/raw/shapenet_car"></label><label>样本选择 <select><option>全部样本</option><option>显式样本列表</option></select></label><label>分片来源 <select><option>官方 partition.yaml</option><option>自定义分片映射</option></select></label><p class="note">界面只示意配置，不扫描用户磁盘。</p><button class="primary" onclick="document.getElementById(\'modal\').close();toast(\'已选中示例数据源\')">选用数据源</button>';document.getElementById('modal').showModal()}
function scanRaw(){const pattern=state.rawPattern||'*';const regexp=new RegExp('^'+pattern.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$','i');state.rawFiles=rawEntries.map(f=>regexp.test(f[2]));state.rawScanned=true;state.rawLogs.push('[datapre/数据集/选择结果] 示例匹配 '+state.rawFiles.filter(Boolean).length+' 个文件');render();toast('已在示例文件列表中匹配，未扫描磁盘')}
function rawCheck(){if(!state.rawFiles.some(Boolean)){toast('请至少选择一个文件');return}state.rawChecked=true;state.rawLogs.push('[datapre/字段/校验] 示例来源与行身份检查通过','[datapre/输出/预检] 检查完成；没有写入数据，下游等待实际交付');render()}
function rawExecute(){if(!state.rawFiles.some(Boolean)){toast('请至少选择一个文件');return}state.rawChecked=true;state.rawRun=true;state.rawLogs.push('[datapre/阶段/开始] 模拟执行','[datapre/字段/提取] surface_pressure / volume_velocity','[datapre/几何/完成] '+(state.rawOptions.geometry?'已示意启用几何派生':'未启用几何派生'),'[datapre/输出/完成] PT'+(state.rawOptions.vtkhdf?' + VTKHDF + 实体映射':''),'[datapre/统计/完成] '+state.rawOptions.stats,'[datapre/阶段/结束] 仅 UI 模拟，无真实产物');render()}
function resetRaw(){state.rawOptions={vtkhdf:false,geometry:true,mask:true,stats:'reference'};state.rawChecked=false;state.rawRun=false;render()}
function rawLogPanel(){return `<section class="panel rawlogs"><div class="toolbar"><h3>处理日志</h3><small class="runningdot">● 示例日志</small><div class="spacer"></div>${btn('清空显示','state.rawLogs=[];render()')}${btn('查看运行记录',"showRecipe('artifacts')")}</div><div class="log">${state.rawLogs.length?state.rawLogs.map(l=>`<div>${esc(l)}</div>`).join(''):'[datapre/配置/就绪] 可先扫描示例文件，再预检或演示执行。'}</div></section>`}
function showComponent(){document.getElementById('modalbody').innerHTML='<h2>用户组件接入</h2><p>以全限定 import 路径选择已有组件；recipe 负责装配，原子能力与模型独立维护。</p><label>组件入口 <input value="my_project.preprocessing.custom_step" style="width:100%"></label><label>源码快照模块 <input value="my_project" style="width:100%"></label><div class="note">仅说明接入方式，不上传或执行任意脚本。正式入口与 snapshot_modules 需配置一致。</div>';document.getElementById('modal').showModal()}
function workbench(){if(!tasks.length)return `<div class="empty">${btn('新建任务','newTask()',true)}</div>`;const t=tasks[state.task]||tasks[0],v=version(t.version),def=stageDefinitions[state.step];return `<div class="heading taskheading"><div><h1>${esc(t.name)} ${statusTag(t.status)}</h1><p class="muted">任务 ID：TASK-${v.id}　 |　 项目：${esc(state.project)}　 |　负责人：${t.owner||'当前用户'}　 |　版本 ${v.id} / 来源 ${v.parent||'—'} / 基线 ${v.baseline||'A1'}</p></div><div class="spacer"></div>${btn('返回任务管理','selectTab(0)')}</div><nav class="topsteps" aria-label="工作台步骤">${steps.map((s,i)=>`<button class="${state.step===i?'active':''} ${i<state.step?'done':''}" onclick="state.stageView='配置';stepGo(${i})"><span>${i<state.step?'✓':i+1}</span><b>${s}</b></button>`).join('')}</nav>${recipeStrip()}${state.step===1?rawProcessing():`<div class="stageheading"><div><h2>${steps[state.step]}</h2><p class="muted">${def.intro}</p></div><div class="spacer"></div><div class="toolbar">${btn('文本查看',"popupVisual('文本')")}${btn('表格查看',"popupVisual('表格')")}${btn('三维查看',"popupVisual('三维可视化')")}</div></div>${state.step===6?`<div class="panel">${postControls()}${postContent()}</div>`:state.step===7?reportContent(true):`<div class="cols stagecols"><section class="panel"><div class="tabs compact">${['配置','输入与输出','可视化预览'].map(m=>`<button class="${state.stageView===m?'active':''}" onclick="state.stageView='${m}';render()">${m}</button>`).join('')}</div>${state.stageView==='配置'?fields():state.stageView==='输入与输出'?assetTable():`<div class="placeholder">查看当前阶段的示例产物</div><div class="foot">${btn('打开查看窗口',"popupVisual('表格')",true)}</div>`}${state.step===5?`<div class="formsection"><h3>训练指标 · 演示数据</h3>${chart()}${btn('启动训练（演示）','simulateStage()',true)} ${btn('查看日志','showLogs()')}</div>`:''}</section><aside class="panel stageaside"><h3>执行与交付</h3><p>${[0,7].includes(state.step)?'平台规划能力':'应用能力已存在 · 页面未接后端'}</p>${btn(state.step===3||state.step===4?'校验配置（演示）':'执行本步骤（演示）','simulateStage()',true)}<hr><h3>阶段交付</h3>${def.output.map((o,i)=>`<button class="assetbutton" onclick="popupVisual('${i===2?'三维可视化':i===0?'表格':'文本'}')">${o} ↗</button>`).join('')}<hr>${btn('查看交接关系',"showRecipe('artifacts')")}</aside></div>`}` }<div class="foot">${state.step>0?btn('← 上一步',`state.stageView='配置';stepGo(${state.step-1})`):''}<div class="spacer"></div>${state.step<7?btn('下一步 →',`state.stageView='配置';stepGo(${state.step+1})`,true):''}</div>`}
function postControls(){return `<div class="postconfig"><label>运行方式 <select><option>连续流程：自动使用本次训练产物</option><option>独立运行：选择已有检查点</option></select></label><label>分片 <select><option>test</option></select></label><label>样本索引 <input value="[0]"></label><label>分块大小 <input value="16384"></label><label><input type="checkbox" checked> 评估并保存预测</label><label><input type="checkbox" checked> 锚点点云 + 完整网格</label></div><div class="note">评估 / 预测 / 网格分别记录进度，部分失败不展示为完整成功。原生参数与输出见“模板配置”和“输入输出交接”。</div>`}

stageDefinitions[2]={intro:'打开产物清单，冻结数据身份和归一化，声明每轮动态采样与拼批。',groups:[['输入与字段绑定',[['加载输入','manifest.json / 已处理数据'],['几何字段','surface_position'],['表面目标','pressure ← surface_pressure'],['体积目标','velocity ← volume_velocity']]],['归一化与物化',[['归一化',['zscore / coordinate / identity']],['物化',['false','true']],['统计来源','参考统计 / 完整训练分片'],['冻结记录','自动生成，不预填数值']]],['几何与域采样',[['几何点预算','3586'],['Supernodes','512'],['锚点数量','256'],['体积锚点数量','256'],['额外查询点','0'],['随机种子','42']]],['采样与拼批契约',[['随机流',['global']],['训练随机性',['per_epoch']],['评估随机性',['fixed']],['准备引用','preparation.json / 自动交付']]]],output:['preparation.json','数据内容摘要','归一化冻结记录','采样 / 拼批声明']};
stageDefinitions[3]={intro:'模型与学习目标由 application 装配；当前 recipe 注入 contrib AB-UPT。',groups:[['模型结构',[['模型',['AB-UPT / 结构版本 3']],['hidden_dim','192'],['geometry_depth','6'],['num_heads','3'],['blocks','pscscscscsc'],['decoder blocks','surface 12 / volume 12']]],['初始化与冻结',[['初始化权重','null / 可选已有兼容权重'],['冻结列表','[]'],['position_dim','3'],['物理特征',['false']]]],['监督目标',[['surface_pressure','MSE / weight 1.0'],['volume_velocity','MSE / weight 1.0'],['反变换','显式归一化字段绑定'],['物理约束','未交付，不参与执行']]],['优化器参数',[['优化器',['lion','adam','adamw']],['学习率','0.00005'],['权重衰减','0.05'],['betas','[0.9, 0.99]']]]],output:['模型配置','监督目标声明','结构版本与权重校验','输入输出契约']};
stageDefinitions[4]={intro:'训练设置映射当前 recipe 参数；网络和优化器在训练装配中创建。',groups:[['预算与设备',[['Epoch','2'],['Batch size','1'],['梯度累积','1'],['设备',['auto','cuda','mps','cpu']],['精度',['fp32']],['num_workers','0']]],['调度与更新',[['scheduler',['warmup_cosine']],['warmup_ratio','0.05'],['min_lr','0.000001'],['gradient_clip','1.0']]],['评估与 EMA',[['evaluation_split',['test']],['test_repeat','10'],['evaluate_repeat',['false','true']],['ema_decay','0.9999'],['ema_save_every','10'],['Callback','当前 recipe 传入空列表']]],['保存与恢复',[['源码快照',['true','false']],['中断时保存',['true','false']],['已有恢复检查点','null'],['日志频率','每 1 轮']]]],output:['最终生效 config.yaml','code.tar.gz','检查点策略','评估与重复协议']};
stageDefinitions[5]={intro:'按 fit / probe / prepare 入口演示配置核验、拟合和恢复；不会启动真实任务。',groups:[['执行入口',[['模式',['fit','probe','prepare']],['准备引用','连续流程自动交接 / 独立运行选择已有 preparation'],['运行根','/shared/runs/car_experiment'],['设备',['auto','mps','cuda','cpu']]]],['监控与交付',[['日志','logs/run.log'],['训练摘要','artifacts/training.json'],['检查点','best.pt / latest.pt / last.pt'],['比较协议','记录设备 / 分片 / 归一化与评估设置']]]],output:['training.json','best / latest / last 检查点','运行日志与源码快照','训练比较协议']};
function showGuide(){document.getElementById('modalbody').innerHTML='<h2>UI v3 · 推荐浏览路径</h2><ol><li>项目卡片 → 项目内六 Tab → 任务列表或版本树。</li><li>版本树选任务 → 切阶段 → 勾选参数 → 添加比较。</li><li>任务工作台 → 第 2 步原始数据处理：选择数据源、扫描示例、勾选文件、配置字段几何与输出。</li><li>预检 → 执行（演示） → 结果卡片、日志与可视化弹窗。</li><li>模板配置 / 执行范围 / 输入输出交接：查看与真实 recipe 的对应。</li></ol><p>图中七步已按此前确认保持为八步。所有按钮只演示界面和跳转，未运行 Python、训练或网格计算。</p>';document.getElementById('modal').showModal()}
