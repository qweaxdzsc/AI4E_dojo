<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI4E VizReport · 科学数据可视化报告平台</title>
    <style>
      /* 启动前防闪：seed 令牌与 styles.css 保持一致，设计运行时挂载后接管 */
      :root {
        --seed-bg: #f4f6fa;
        --seed-surface: #ffffff;
        --seed-fg: #171c26;
        --seed-primary: #1677ff;
        --seed-radius: 8px;
      }
      body {
        margin: 0;
        background: var(--seed-bg);
        color: var(--seed-fg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }
      .app-boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .app-boot article {
        background: var(--seed-surface);
        border-radius: var(--seed-radius);
        border: 1px solid color-mix(in srgb, var(--seed-fg) 10%, transparent);
        padding: 28px 36px;
        text-align: center;
      }
      .app-boot h1 {
        font-size: 16px;
        letter-spacing: -0.01em;
        margin: 0 0 6px;
      }
      .app-boot p {
        font-size: 12.5px;
        color: color-mix(in srgb, var(--seed-fg) 55%, transparent);
        margin: 0;
      }
      .app-boot .pulse {
        width: 34px;
        height: 34px;
        margin: 0 auto 14px;
        border-radius: 9px;
        background: color-mix(in srgb, var(--seed-primary) 14%, var(--seed-surface));
        color: var(--seed-primary);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-component="app-root">
      <main class="app-boot" data-component="app-boot" aria-busy="true">
        <article>
          <div class="pulse" aria-hidden="true">A4</div>
          <h1>AI4E VizReport</h1>
          <p>正在加载科学数据可视化报告工作区…</p>
        </article>
      </main>
    </div>
    <script type="module" src="./canvas-selection-bridge.js"></script>
    <script type="module" src="./src/qoder-design-runtime.jsx"></script>
  </body>
</html>
