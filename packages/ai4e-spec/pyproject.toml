[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai4e-spec"
version = "0.1.0"
description = "AI4E 稳定数据、组件与 artifact 契约"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "ai4e_spec/__init__.py"
"data" = "ai4e_spec/data"
"components" = "ai4e_spec/components"
"artifacts" = "ai4e_spec/artifacts"
"check" = "ai4e_spec/check"
