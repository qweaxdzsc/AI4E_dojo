[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "ai4e-server"
version = "0.1.0"
description = "Dojo 本机研究工作台服务"
requires-python = ">=3.12"
dependencies = ["ai4e-spec", "ai4e-task", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pyyaml>=6", "psutil>=7,<8"]
[tool.uv.sources]
ai4e-spec = {workspace = true}
ai4e-task = {workspace = true}
[tool.hatch.build.targets.wheel]
bypass-selection = true
[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "ai4e_server/__init__.py"
"__main__.py" = "ai4e_server/__main__.py"
"bootstrap" = "ai4e_server/bootstrap"
"modules" = "ai4e_server/modules"
"infrastructure" = "ai4e_server/infrastructure"
