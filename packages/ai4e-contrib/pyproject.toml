[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "ai4e-contrib"
version = "0.1.0"
description = "AI4E 共享数据集与扩展能力"
requires-python = ">=3.12"
dependencies = ["ai4e-core", "ai4e-spec"]
[tool.uv.sources]
ai4e-core = { workspace = true }
ai4e-spec = { workspace = true }
[tool.hatch.build.targets.wheel]
bypass-selection = true
[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "ai4e_contrib/__init__.py"
"application" = "ai4e_contrib/application"

"ability" = "ai4e_contrib/ability"
"Notice" = "ai4e_contrib/Notice"

[project.optional-dependencies]
wdno = ["einops>=0.8", "ema-pytorch==0.8.3", "pytorch-wavelets==1.3.0", "PyWavelets>=1.6", "setuptools<81", "tqdm>=4.66"]
safediffcon = ["einops>=0.8", "ema-pytorch>=0.8", "scipy>=1.14", "pyarrow>=17", "ai4e-core[hdf5]"]
gencp = ["timm==1.0.29", "einops>=0.8", "scipy>=1.14", "setuptools<81", "requests>=2.32", "ai4e-core[hdf5,post]"]
pibsnet = ["scipy>=1.14"]
abupt = ["einops>=0.8", "torch-geometric==2.6.1", "torch-scatter==2.1.2", "torch-cluster==1.6.3"]

transolver3 = ["einops>=0.8", "ai4e-core[hdf5]"]
