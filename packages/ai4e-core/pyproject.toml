[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai4e-core"
version = "0.1.0"
description = "AI4E 原子能力、业务装配与本地执行引擎"
requires-python = ">=3.12"
dependencies = [
    "ai4e-spec",
    "huggingface-hub>=0.34",
    "numpy>=2.0",
    "scikit-learn==1.9.0",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "torch>=2.4",
    "vtk>=9.3",
    "zarr>=3.1,<4",
    "torchvista>=0.2.12,<0.3",
]

[tool.uv.sources]
ai4e-spec = { workspace = true }

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "ai4e_core/__init__.py"
"abilities" = "ai4e_core/abilities"
"applications" = "ai4e_core/applications"
"base" = "ai4e_core/base"
"run" = "ai4e_core/run"
"tools" = "ai4e_core/tools"

[project.optional-dependencies]
modeling = ["einops>=0.8"]
hdf5 = ["h5py>=3.11"]
