model:
  kind: noether.modeling.models.aerodynamics.AeroABUPT
  name: ab_upt
  optimizer_config:
    kind: noether.core.optimizer.Lion
    lr: 8.0e-05
    weight_decay: 0.02
    clip_grad_norm: 1.0
    schedule_config:
      kind: noether.core.schedules.LinearWarmupCosineDecaySchedule
      end_value: 1.0e-06
      max_value: 8.0e-05
      warmup_percent: 0.05
  forward_properties:
  - geometry_position
  - geometry_supernode_idx
  - geometry_batch_idx
  - surface_anchor_position
  - volume_anchor_position
  supernode_pooling_config:
    hidden_dim: 192
    input_dim: 3
    radius: 9.0
  transformer_block_config:
    hidden_dim: 192
    num_heads: 3
    mlp_hidden_dim: 768
    mlp_expansion_factor: 4
    use_rope: true
  geometry_depth: 6
  hidden_dim: 192
  physics_blocks:
  - perceiver
  - self
  - cross
  - self
  - cross
  - self
  - cross
  - self
  - cross
  - self
  - cross
  num_domain_decoder_blocks:
    surface: 12
    volume: 12
  data_specs:
    position_dim: 3
    domains:
      surface:
        output_dims:
          pressure: 1
        feature_dim:
          surface_sdf: 1
          surface_normals: 3
      volume:
        output_dims:
          velocity: 3
        feature_dim:
          volume_sdf: 1
          volume_normals: 3
trainer:
  kind: noether.training.trainers.WeightedLossTrainer
  max_epochs: 2
  effective_batch_size: 1
  callbacks:
  - kind: noether.core.callbacks.CheckpointCallback
    every_n_epochs: 10
    save_weights: true
    save_latest_weights: true
  - kind: noether.training.callbacks.OfflineLossCallback
    every_n_epochs: 1
    batch_size: 1
    dataset_key: test
  - kind: noether.core.callbacks.BestCheckpointCallback
    every_n_epochs: 1
    metric_key: loss/test/total
  - kind: noether.core.callbacks.EmaCallback
    every_n_epochs: 10
    target_factors:
    - 0.9999
    save_weights: false
    save_last_weights: false
    save_latest_weights: true
  - every_n_epochs: 1
    batch_size: 1
    dataset_key: test
    forward_properties:
    - geometry_position
    - geometry_supernode_idx
    - geometry_batch_idx
    - surface_anchor_position
    - volume_anchor_position
    kind: aero_cfd.callbacks.AeroMetricsCallback
  log_every_n_epochs: 1
  forward_properties:
  - geometry_position
  - geometry_supernode_idx
  - geometry_batch_idx
  - surface_anchor_position
  - volume_anchor_position
  target_properties:
  - surface_pressure_target
  - volume_velocity_target
  field_weights:
    surface_pressure: 1.0
    volume_velocity: 1.0
output_path: /tmp/dojo-mps-research-20260909/noether-runs
config_schema_kind: noether.core.schemas.schema.ConfigSchema
